services:
  mysql:
    image: mysql:8.4
    container_name: orderflow-mysql
    ports:
      - "3306:3306"
    environment:
       MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
       MYSQL_DATABASE: orderflow
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:latest
    container_name: orderflow-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: orderflow
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
